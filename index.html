<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 Book Club Library</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 1100px; margin: auto; }
    h1 { margin-bottom: 10px; }
    input[type="file"], input[type="text"] { margin: 10px 0; padding: 6px; width: 100%; max-width: 320px; }

    /* Bookshelf layout */
    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .book {
      background: linear-gradient(135deg, #8b5e3c, #a47148);
      color: #fff;
      padding: 12px;
      height: 160px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease;
    }

    .book.available { background: linear-gradient(135deg, #2e7d32, #4caf50); }
    .book.borrowed { background: linear-gradient(135deg, #8b0000, #c62828); }

    .book:hover { transform: scale(1.05); }

    .book-title {
      font-weight: bold;
      font-size: 0.95em;
      line-height: 1.2em;
    }

    .book-author {
      font-size: 0.8em;
      opacity: 0.9;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      position: relative;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-size: 20px;
    }

    .hint { font-size: 0.9em; color: #555; }
  </style>
</head>
<body>

<h1>📚 Book Club Library</h1>
<p class="hint">Book list is loaded automatically from the shared file.</p>

<input type="text" id="searchInput" placeholder="Search by title or author..." />

<div class="shelf" id="bookshelf"></div>

<!-- Modal -->
<div class="modal" id="bookModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 id="modalTitle"></h3>
    <p><strong>Author:</strong> <span id="modalAuthor"></span></p>
    <p><strong>Status:</strong> <span id="modalStatus"></span></p>
    <p><strong>Contact:</strong> <span id="modalContact"></span></p>
  </div>
</div>

<script>
// --------------------------------------------------
// This array holds ALL book data after loading
// We filter/search from this instead of reloading the file
// --------------------------------------------------
let allRows = [];

// --------------------------------------------------
// STEP 1: LOAD EXCEL FILE FROM A FIXED LOCATION
// This assumes the Excel file is hosted at a known URL
// and is accessible from this webpage (same server or CORS enabled)
// --------------------------------------------------

const EXCEL_FILE_URL = 'https://github.com/ramyawantstoknow/book-club-library/blob/main/books.xlsx'; // change path if needed

fetch(EXCEL_FILE_URL)
  .then(response => response.arrayBuffer()) // read file as binary data
  .then(data => {
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    allRows = XLSX.utils.sheet_to_json(sheet);
    renderShelf(allRows);
  })
  .catch(error => {
    console.error('Error loading Excel file:', error);
  });(e.target.files[0]);
});

document.getElementById('searchInput').addEventListener('input', function(e) {
  const query = e.target.value.toLowerCase();
  const filtered = allRows.filter(row =>
    Object.values(row).some(val => String(val).toLowerCase().includes(query))
  );
  renderShelf(filtered);
});

// --------------------------------------------------
// STEP 2: RENDER BOOKS ON THE VISUAL BOOKSHELF
// Takes an array of book objects and creates UI cards
// --------------------------------------------------
function renderShelf(rows) {
  const shelf = document.getElementById('bookshelf');
  shelf.innerHTML = '';

  rows.forEach(row => {
    const status = String(row.Status || '').toLowerCase();
    const book = document.createElement('div');
    book.className = 'book ' + (status.includes('available') ? 'available' : status.includes('borrowed') ? 'borrowed' : '');

    book.innerHTML = `
      <div class="book-title">${row.Title || 'Untitled'}</div>
      <div class="book-author">${row.Author || ''}</div>
    `;

    book.onclick = () => openModal(row);
    shelf.appendChild(book);
  });
}

function openModal(row) {
  document.getElementById('modalTitle').innerText = row.Title || '';
  document.getElementById('modalAuthor').innerText = row.Author || '';
  document.getElementById('modalStatus').innerText = row.Status || '';
  document.getElementById('modalContact').innerText = row.Contact || '';
  document.getElementById('bookModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('bookModal').style.display = 'none';
}
</script>

</body>
</html>
